[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quench"
dynamic = ["version"]
description = "Predict benchmark scores from a fraction of the queries"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{ name = "Helivan", email = "hayden@helivan.io" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["requests>=2.28.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-requests>=2.28.0",
]

[project.urls]
Homepage = "https://quench.helivan.io"
Documentation = "https://quench.helivan.io/docs"
Repository = "https://github.com/helivan-research/quench"
Changelog = "https://github.com/helivan-research/quench/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "quench/__init__.py"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
